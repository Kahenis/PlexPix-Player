name: Release APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: V1.3.8
          name: PlexPix-Player V1.3.8
          body: |
            Appui long 2 secondes : Partager, Télécharger, Supprimer (serveur + cache).
            Correction installation APK.
            Voir README pour le détail.
          fail_on_unmatched_files: false
